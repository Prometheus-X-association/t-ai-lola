- name: Clone Git repository to temp directory
  git:
    repo: "{{ git_repo_url }}"
    dest: /tmp/t-ai-lola_lolapy
    version: "{{ git_repo_version | default('main') }}"
    force: yes

- name: Ensure target directory exists
  file:
    path: "{{ git_repo_dest }}"
    state: directory

- name: Copy lolapy application folder
  copy:
    src: "/tmp/t-ai-lola_lolapy/app/lolapy/"
    dest: "{{ git_repo_dest }}/"
    remote_src: yes

- name: Remove temp directory
  file:
    path: /tmp/t-ai-lola_lolapy
    state: absent
- name: Create certs directory
  file:
    path: "{{ git_repo_dest }}/certs"
    state: directory

- name: Create .env file
  copy: 
    src: "{{ git_repo_dest }}/.env.sample"
    dest: "{{ git_repo_dest }}/.env"
    remote_src: yes

- name: Define default environment variables
  set_fact:
    lolapy_env_vars:
      - { key: 'FRONTEND_API_IP', value: '{{ dmz_ip }}' }
      - { key: 'HARBOR_HOST', value: '{{ dmz_ip }}' }
      - { key: 'HARBOR_USER', value: 'backend' }
      - { key: 'HARBOR_PASSWORD', value: '{{ harbor_password }}' }
      - { key: 'LOLAPY_HOST_IP', value: '{{ arch_ip }}' }

- name: Append Slurm specific environment variables
  set_fact:
    lolapy_env_vars: "{{ lolapy_env_vars + [ { 'key': 'CLUSTER_TYPE', 'value': 'slurm' }, { 'key': 'CLUSTER_HOST', 'value': '{{ groups[\"calc_master\"][0] | default(\"calc-master-1\") }}' } ] }}"
  when: orchestrator | default('slurm') == 'slurm'

- name: Append Kubernetes specific environment variables
  set_fact:
    lolapy_env_vars: "{{ lolapy_env_vars + [ { 'key': 'CLUSTER_TYPE', 'value': 'k8s' }, { 'key': 'K8S_PVC_NAME', 'value': 'pvc-nfs-static' }, { 'key': 'K8S_NAMESPACE', 'value': 'default' } ] }}"
  when: orchestrator | default('slurm') == 'kubernetes'

- name: Set environment variables
  lineinfile:
    path: "{{ git_repo_dest }}/.env"
    regexp: '^{{ item.key }}='
    line: "{{ item.key }}={{ item.value }}"
  with_items: "{{ lolapy_env_vars }}"

- name: Copy docker-compose file for Slurm
  copy:
    src: "{{ git_repo_dest }}/docker-compose.slurm.yml"
    dest: "{{ git_repo_dest }}/docker-compose.yml"
    remote_src: yes
  when: orchestrator | default('slurm') == 'slurm'

- name: Copy docker-compose file for Kubernetes
  copy:
    src: "{{ git_repo_dest }}/docker-compose.k8s.yml"
    dest: "{{ git_repo_dest }}/docker-compose.yml"
    remote_src: yes
  when: orchestrator | default('slurm') == 'kubernetes'

- name: Copy kubeconfig file to host
  copy:
    src: "{{ kubernetes_kubeconfig_path | default('kubeconfig.yml') }}"
    dest: "{{ git_repo_dest }}/kubeconfig.yml"
    owner: lolauser
    group: lolauser
    mode: '0600'
  when: orchestrator | default('slurm') == 'kubernetes'

- name: Deploy Kubernetes objects manifest
  template:
    src: k8s-objects.yml.j2
    dest: "{{ git_repo_dest }}/k8s-objects.yml"
    owner: lolauser
    group: lolauser
    mode: '0600'
  when: orchestrator | default('slurm') == 'kubernetes'

- name: Generate private key
  command: "openssl genpkey -algorithm RSA -out private.key -pkeyopt rsa_keygen_bits:2048"
  args:
    chdir: "{{ git_repo_dest }}/certs"
    
- name: Generate public key
  command: "openssl req -new -x509 -key private.key -out certificate.crt -days 365 -subj \"/CN=example.com\""
  args:
    chdir: "{{ git_repo_dest }}/certs"

- name: Get docker group ID
  command: getent group docker
  register: docker_group_entry

- name: Set docker group variable
  set_fact:
    docker_group: "{{ docker_group_entry.stdout.split(':')[2] }}"

- name: Start application with docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ git_repo_dest }}"
    state: present
  environment:
    DOCKER_GROUP: "{{ docker_group }}"
    SFTP_USER: "{{ arch_sftp_user }}"
    SFTP_PASSWORD: "{{ arch_sftp_password }}"
    MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
    DATABASE_NAME: "{{ database_name }}"
    MYSQL_USER: "{{ mysql_user }}"
    MYSQL_PASSWORD: "{{ mysql_password }}"
  register: compose_output

- name: change munge key permissions
  command: 
    cmd: docker exec -u root lolapy-hueyconsumer-1 chown munge:munge /etc/munge/munge.key
  when: orchestrator | default('slurm') == 'slurm'

- name: restart hueyconsumer
  command: 
    cmd: docker compose -f {{ git_repo_dest }}/docker-compose.yml restart hueyconsumer
  environment: 
    DOCKER_GROUP: "{{ docker_group }}"

- name: prepare sftp container
  command: "docker exec lolapy-sftp-1 chown {{ dmz_sftp_user }} /home/{{ dmz_sftp_user }}/upload"

- name: change certs permissions
  command: "docker exec -u root lolapy-hueyconsumer-1 chown -R lolauser /tmp/certs"

- name: give user lola access to home
  command: "docker exec -u root lolapy-hueyconsumer-1 chown -R lolauser /home/lolauser"

    
- name: Generate SSH key on the host
  user:
    name: lolauser
    generate_ssh_key: yes
    ssh_key_bits: 4096
    ssh_key_type: rsa
    ssh_key_file: .ssh/id_rsa
  when: orchestrator | default('slurm') == 'slurm'

- name: Create .ssh directory inside the container
  command: "docker exec -u root lolapy-hueyconsumer-1 mkdir -p /home/lolauser/.ssh"
  changed_when: false
  when: orchestrator | default('slurm') == 'slurm'

- name: Copy SSH private key to container
  command: "docker cp /home/lolauser/.ssh/id_rsa lolapy-hueyconsumer-1:/home/lolauser/.ssh/id_rsa"
  when: orchestrator | default('slurm') == 'slurm'

- name: Copy SSH public key to container
  command: "docker cp /home/lolauser/.ssh/id_rsa.pub lolapy-hueyconsumer-1:/home/lolauser/.ssh/id_rsa.pub"
  when: orchestrator | default('slurm') == 'slurm'

- name: Set permissions on SSH files in container
  command: "{{ item }}"
  loop:
    - "docker exec -u root lolapy-hueyconsumer-1 chown -R lolauser:lolauser /home/lolauser/.ssh"
    - "docker exec -u root lolapy-hueyconsumer-1 chmod 700 /home/lolauser/.ssh"
    - "docker exec -u root lolapy-hueyconsumer-1 chmod 600 /home/lolauser/.ssh/id_rsa"
    - "docker exec -u root lolapy-hueyconsumer-1 chmod 644 /home/lolauser/.ssh/id_rsa.pub"
  when: orchestrator | default('slurm') == 'slurm'

- name: Fetch ssh key
  fetch:
    src: /home/lolauser/.ssh/id_rsa.pub
    dest: /tmp/id_rsa.pub
    flat: yes
  run_once: yes
  when: orchestrator | default('slurm') == 'slurm'