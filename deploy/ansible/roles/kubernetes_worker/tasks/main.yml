---
- name: Setup Kubernetes Worker Nodes
  block:
    - name: Disable swap
      command: swapoff -a
      changed_when: false

    - name: Disable swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Load kernel modules for Kubernetes
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure kernel modules to load on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Set sysctl parameters for Kubernetes
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        state: present
        reload: yes
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Ensure containerd config directory exists
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Check if containerd config.toml exists
      stat:
        path: /etc/containerd/config.toml
      register: containerd_config_stat

    - name: Check if SystemdCgroup is defined in config.toml
      shell: grep -q "SystemdCgroup" /etc/containerd/config.toml
      register: systemdcgroup_exists
      ignore_errors: true
      changed_when: false
      when: containerd_config_stat.stat.exists

    - name: Initialize containerd config
      shell: containerd config default > /etc/containerd/config.toml
      when: not containerd_config_stat.stat.exists or containerd_config_stat.stat.size == 0
      notify: restart containerd

    - name: Add SystemdCgroup block to containerd config if missing
      blockinfile:
        path: /etc/containerd/config.toml
        block: |
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
            SystemdCgroup = true
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR SYSTEMD CGROUP"
        state: present
      when:
        - containerd_config_stat.stat.exists
        - systemdcgroup_exists.rc is defined and systemdcgroup_exists.rc != 0
      notify: restart containerd

    - name: Configure SystemdCgroup for containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    - name: Ensure cri is not in disabled_plugins
      replace:
        path: /etc/containerd/config.toml
        regexp: 'disabled_plugins\s*=\s*\[\s*"cri"\s*\]'
        replace: 'disabled_plugins = []'
      notify: restart containerd

    - name: Flush handlers to restart containerd if config changed
      meta: flush_handlers

    - name: Install Kubernetes prerequisites (Debian/Ubuntu)
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Download Kubernetes APT signing key
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
        force: yes
      when: ansible_os_family == "Debian"

    - name: Add Kubernetes APT repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
        state: present
        filename: kubernetes
      when: ansible_os_family == "Debian"

    - name: Install Kubernetes components (Debian/Ubuntu)
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Hold Kubernetes packages from automatic updates (Debian/Ubuntu)
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
      when: ansible_os_family == "Debian"

    - name: Add Kubernetes YUM repository (RedHat/CentOS)
      yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/"
        enabled: yes
        gpgcheck: yes
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/repodata/repomd.xml.key"
      when: ansible_os_family == "RedHat"

    - name: Install Kubernetes components (RedHat/CentOS)
      yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes
      when: ansible_os_family == "RedHat"

    - name: Enable and start kubelet service
      systemd:
        name: kubelet
        enabled: yes
        state: started

    - name: Check if node is already joined to Kubernetes cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: k8s_kubelet_conf

    - name: Join the Kubernetes cluster
      command: "{{ hostvars[kubernetes_control_plane_host]['kubernetes_join_command'] }}"
      when:
        - not k8s_kubelet_conf.stat.exists
        - hostvars[kubernetes_control_plane_host]['kubernetes_join_command'] is defined

    - name: Taint worker node
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf label node {{ ansible_hostname | lower }} node-role.kubernetes.io/worker= 
      delegate_to: "{{ kubernetes_control_plane_host }}"
      register: taint_output
      until: taint_output.rc == 0
      retries: 5
      delay: 5
      changed_when: "'tainted' in taint_output.stdout"

  when: setup_kubernetes | default(false) | bool
