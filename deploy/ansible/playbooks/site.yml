- name: Configure ARCH servers
  hosts: arch
  become: yes
  roles:
    - common
    - docker
    - create_user
    - cron_script
    - harbor
    - nfs_server
    - { role: slurm_client, when: orchestrator | default('slurm') == 'slurm' }
    - lolapy

- name: Configure DMZ servers
  hosts: dmz
  become: yes
  roles:
    - common
    - docker
    - harbor
    - frontend

- name: Configure Common CALC environment
  hosts: calc
  become: yes
  roles:
    - { role: common, when: (orchestrator | default('slurm') == 'slurm') or (setup_kubernetes | default(false) | bool) }
    - { role: docker, when: (orchestrator | default('slurm') == 'slurm') or (setup_kubernetes | default(false) | bool) }
    - { role: create_user, when: (orchestrator | default('slurm') == 'slurm') or (setup_kubernetes | default(false) | bool) }

- name: Configure CALC Master node
  hosts: calc_master
  become: yes
  roles:
    - { role: kubernetes_control_plane, when: setup_kubernetes | default(false) | bool }
    - { role: slurm_controller, when: orchestrator | default('slurm') == 'slurm' }

- name: Configure CALC Worker nodes
  hosts: calc_worker
  become: yes
  roles:
    - { role: kubernetes_worker, when: setup_kubernetes | default(false) | bool }
    - { role: slurm_worker, when: orchestrator | default('slurm') == 'slurm' }

- name: Configure CALC Workers NFS mount
  hosts: calc_worker
  become: yes
  roles:
    - { role: nfs_client, when: orchestrator | default('slurm') == 'slurm' }