#     - lolapy

# - name: Setup DMZ Services (Harbor, Frontend)
#   hosts: dmz
#   become: yes
#   roles:
#     - harbor
#     - frontend

- name: Finish Calc Workers Setup (NFS Client, Workers, SSH Keys, Kubernetes Workers)
  hosts: calc_worker
  become: yes
  roles:
    - { role: kubernetes_worker, when: setup_kubernetes | default(false) | bool }
    - { role: nfs_client, when: orchestrator | default('slurm') == 'slurm' }
    - { role: slurm_worker, when: orchestrator | default('slurm') == 'slurm' }
    - { role: ssh_key, when: orchestrator | default('slurm') == 'slurm' }
