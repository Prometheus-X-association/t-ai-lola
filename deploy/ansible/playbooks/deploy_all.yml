- name: Gather facts from all hosts
  gather_facts: yes
  hosts: all
# - name: Global Setup (All Nodes)
#   hosts: all
#   become: yes
#   roles:
#     - common
#     - docker
#     - create_user

- name: Setup Calc Master Node (Slurm Controller, Kubernetes Control Plane)
  hosts: calc_master
  become: yes
  roles:
    - { role: kubernetes_control_plane, when: setup_kubernetes | default(false) | bool }
    - { role: slurm_controller, when: orchestrator | default('slurm') == 'slurm' }

# - name: Setup Arch Node (Slurm Client, NFS, Harbor, Lolapy)
